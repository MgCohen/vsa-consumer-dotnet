# Builds and tests the app with the published VSA packages from GitHub Packages.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # nuget.config reads the token of the VSA feed from GITHUB_TOKEN.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet vsa doctor
      - run: dotnet test --solution Consumer.slnx
