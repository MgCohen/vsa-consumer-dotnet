# Builds and tests the app with the published Umpire packages from GitHub Packages.
# The build of Consumer.csproj runs the architecture check (Umpire.Engine.Build).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # nuget.config reads the token of the Umpire feed from GITHUB_TOKEN.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore
      - run: dotnet umpire doctor
      - run: dotnet build Consumer.slnx
      - run: dotnet test --solution Consumer.slnx --no-build
